<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        button {
            transition: 0.3s;
        }

        button:hover {
            background-color: black;
            color: white;
            transform: scale(1.5);
        }

        button:active {
            background-color: royalblue;
        }

        a:link {
            /* Only for Anchor tag */
            color: greenyellow;
        }

        a:visited {
            /* Only for Anchor tag */
            color: aqua;
        }

        a:active {
            color: blue;
        }
    </style>
</head>

<body>

    <!-- Only single symbol ':' is used in Pseudo Class.-->

    <h1>
        Learn Pseudo Class Selector.
    </h1>

    <button>
        Submit
    </button>

    <br>

    <a href="www.ajio.com">A jio</a>
    <a href="www.myntra.com">Myntra</a>

</body>

</html>
