<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>

<body>

    <!--
    action is an attribute to provide the database server url. and method attribute is used to either store or post data.
    But nowadays we don't use these attributes rather we use fetch of Javascript
    -->>

    <form>

        <label for="Username">Username</label>

        <!-- 
        for attribute is used to connect input to label
        -->>

        <input type="text" id="Username" placeholder="Enter Username" value="John" name="Username">

        <!--
        name is a variable which store data
        -->>

        <!--
        Content in placeholder is auto remove when you start typing in input column 
        but on contrary Content written inside value has to be remove first and work as default input.
        -->>

        <br>

        <label for="email">Email</label>

        <input type="email" id="email" placeholder="Enter Email" name="email">

        <br>

        <label for="password">Password</label>

        <input type="password" id="password" placeholder="Enter password" name="password">

        <br>

        <label for="country">Country</label>

        <select name="country" id="country">

            <option value="">India</option>
            <option value="">China</option>
            <option value="">USA</option>

        </select>

        <br>

        <label for="course">Choose your Course</label>

        <input type="text" id="course" placeholder="Choose your course" name="course" list="courselist">

        <datalist id="courselist">

            <option value="java">Java</option>
            <option value="mern">Mern</option>
            <option value="python">Python</option>

        </datalist>

        <!-- 
        Select tag is used to create drop down whereas datalist is used to provide suggestion means 
        user can enter other input text as well. 
        -->>

        <br>

        <button>Submit</button>

    </form>

</body>

</html>

<!--
-> Text formating tags used to format text they are INLINE Elemets

-> Style is Global attribute

-> id is also Global attribute
-->>
