<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .box1 {
            height: 200px;
            width: 200px;
            background-color: yellow;
            border: 10px solid black;
            padding: 50px;
            margin: 50px;
            box-sizing: border-box;
        }

        .box2 {
            height: 200px;
            width: 200px;
            background-color: lightgreen;
            padding: 80px;
            border: 5px solid black;
        }
    </style>
</head>

<body>

    <h1>
        Learn Box Model.
    </h1>

    <!-- 

    There are 4 Components in Box Model :- 
    
    1. Content - space occupied by data.
    2. Padding - space between data and the border.
    3. Border - outline of the element is Border.
    4. Margin - space around an element is known as Margin.

    -->

    <div class="box1">
        Box 1
    </div>

    <div class="box2">
        Box 2
    </div>

</body>

</html>
