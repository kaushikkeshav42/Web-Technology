-> Local Storage - Data is stored in Key : Value pair.

-> Session Storage - Ex Any type of online meeting, call.
   Here data is not persist. As you close the tab the data is lost.

-> Cookies - It is also a type of Browser Storage used from Backend.
   Unlike Local Storage which is used in Frontend.
   Data persist here for some time greater than Session storage but less than Local Storage.
