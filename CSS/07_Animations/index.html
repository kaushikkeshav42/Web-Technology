<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .box1 {
            height: 200px;
            width: 200px;
            border: 1px solid black;
            background-color: lightgrey;
            animation-name: boxslide1;
            animation-duration: 5s;
            animation-iteration-count: infinite;
            position: absolute;
        }

        .box2 {
            height: 200px;
            width: 200px;
            border-radius: 50%;
            border: 1px solid black;
            position: absolute;
            background-color: lightgreen;
            animation-name: boxslide2;
            animation-duration: 10s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
        }

        .box8 {
            height: 400px;
            width: 400px;
            margin: 200px 38%;
            border-radius: 50%;
            border: 1px solid black;
            position: absolute;
            background-color: lightgreen;
        }

        .box3 {
            height: 100px;
            width: 100px;
            border-radius: 50%;
            border: 1px solid black;
            position: absolute;
            background-color: lightblue;
        }

        @keyframes boxslide1 {
            from {
                left: 0;
                top: 0;
            }

            to {
                top: 0;
                left: calc(100% - 200px);
            }
        }

        @keyframes boxslide2 {
            0% {
                left: 0;
                top: 0;
            }

            25% {
                top: 0;
                left: calc(100% - 200px);
            }

            50% {
                top: calc(100% - 200px);
                left: calc(100% - 200px);
            }

            75% {
                top: calc(100% - 200px);
                left: 0;
            }

            100% {
                top: 0;
                left: 0;
            }
        }
    </style>
</head>

<body>
    <!-- <div class="box1"></div> -->
    <div class="box8">
        <div class="box3">
            <div class="box4">

            </div>
        </div>
        <div class="box3">
            <div class="box4">

            </div>
        </div>
        <div class="box5">

        </div>
    </div>
</body>

</html>
