•	Element ->  Opening and Closing tag with Content.

•	Types of Element :- 
1)	Block Element – it aquire full width of line and accept height and width.
2)	Inline Element – aquire Content width only, it don’t accept height and width.

•	<div> </div> -> Block Element tag.
Ex. <div style = “backgroundcolor : red;”>
Here style is a Attribute.

•	<span> </span> ->  Inline Element tag.

Tags – These are refer to as Keyword enclosed inside angular Bracket (<>) specifically called opening tag. 
Ex - <Keyword> = Opening Tag.
</Keyword> = Closing Tag. – Similar to opening tag with forward Slash (/) in the starting of Keyword.

Paired Tags - <tag_name> </tag_name> = These type of tags can hold data within it like a container.
We must need to close these types of tags.
Ex - <div> Content </div> etc.

Unpaired Tags - <tag_name> = These types of tags can’t hold data within it.
Ex - <br>, <hr>, <input> etc.
We need not to close these types of Tags.

Q 1. What is an Element ?
Sol - Element is a combination of Opening tag + Content + Closing tag.

Q 2. What is void Element ?
Sol – The tag which can’t hold any content is called Void Element / Empty Element.

Q 3. What is a Attribute ?
Sol – An attribute means properties of a tag or additional information of the tag. 
    Attribute should always be written inside an opening tag. 
    Ex. - <div id=”Container”; class= “d1 Content”> Hello <div>

!Doctype html = Document type declaration it tells us which version of html is currently there in file. It is not a of tag.

Types of Path :-
•	Absolute Path – Path provided directly by the server.
Ex – https://content/.com

•	Relative Path – Path provided by our local workspace.
Ex - ./,  ../,  / 
1)  ./ - is used to target current open folder.
2)  ../ - is used to target one folder back.
3)   / - directly target root folder.
