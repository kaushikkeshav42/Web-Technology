    <style>
        body {

        .box1 {
            height: 200px;
            width: 200px;
            border: 5px dashed black;
            background-color: orange;

        .box2 {

        }

        section {
            background-color: yellow;
            height: 10vh;
        }

        .box4 {
            height: 1em;
            width: 1em;
            background-color: green;
            font-size: 200px;
        }

        html {
            font-size: 200px;
        }

        .box5 {
            height: 1rem;
            width: 1rem;
            background-color: crimson;
            font-size: 100px;
        }
    </style>
</head>

<body>
    <!-- 
    
    There are 5 types of Units :-
    
    1. px  -- fixed / absolute Unit.
    2. vh and vw -- relative Unit.
    3. %  -- relative Unit.
    4. em  -- relative Unit.
    5. rem  -- relative Unit.

    Q. -> What are the Similarities and differences between em and rem.
    Ans - Similarities :- 
          em = 16px (by default).
          rem = 16px (by default.)
        
        Differences :-
          em values - dependent on current element font-size.
          rem values - dependent on root element (html tag) font-size.
    -->
